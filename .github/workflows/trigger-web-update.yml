name: Trigger rebuild of Acton websites

# When there are changes to files under docs/acton-guide on main branch,
# trigger the workflows to rebuild the Acton websites
on:
  push:
    branches:
      - main
    paths:
      - 'docs/acton-guide/**'

jobs:
  trigger_web_rebuild:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - actonlang/acton.now
          - actonlang/www.acton-lang.org
          - actonlang/acton.guide

    steps:
      - name: "Trigger build of ${{ matrix.repo }}"
        uses: benc-uk/workflow-dispatch@v1
        with:
          repo: ${{ matrix.repo }}
          token: ${{ secrets.ACTBOT_PAT }}
          workflow: main.yml
          ref: main
